[project]
name = "minilab"
version = "0.1.0"
description = "CPECOG2 transfer learning mini-lab: scratch CNN vs ResNet-50 feature extraction, partial and full fine-tuning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "pandas",
    "pillow",
    "scikit-learn",
    "tabulate>=0.10.0",
    "torch",
    "torchvision",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.14.0"]
build-backend = "uv_build"
